<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    Gesture X — Offscreen Document
    This document runs silently in the background (never shown to the user).
    It hosts the camera stream, MediaPipe WASM, and Web Speech API.
    MV3 requires an offscreen document to access getUserMedia outside a tab context.
  -->
  <title>Gesture X — Offscreen</title>
</head>
<body>
  <!--
    The video element receives the raw camera stream.
    'playsinline' and 'muted' are required for autoplay policies.
    'autoplay' is required so MediaPipe can read frames without user interaction.
    Hidden via CSS — never displayed to the user.
  -->
  <video
    id="gesture-x-video"
    playsinline
    muted
    autoplay
    width="640"
    height="480"
    style="display:none;position:absolute;top:-9999px;left:-9999px;"
    aria-hidden="true"
  ></video>

  <!--
    Canvas element used for frame extraction when ImageBitmap is unavailable.
    Also hidden — internal use only.
  -->
  <canvas
    id="gesture-x-canvas"
    width="640"
    height="480"
    style="display:none;position:absolute;top:-9999px;left:-9999px;"
    aria-hidden="true"
  ></canvas>

  <!--
    MediaPipe Tasks Vision is imported dynamically in GestureEngine.js.
  -->

  <script src="offscreen.js" type="module"></script>
</body>
</html>

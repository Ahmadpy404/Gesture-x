<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gesture X</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Header -->
  <header class="header" role="banner">
    <div class="header-logo">
      <div class="logo-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 11V6a1 1 0 0 1 2 0v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M11 10V5a1 1 0 0 1 2 0v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M13 10V6a1 1 0 0 1 2 0v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M7 13V9a1 1 0 0 1 2 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M7 13c0 3.866 3.134 7 7 7 3.866 0 7-3.134 7-7V9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="logo-text">
        <span class="logo-name">Gesture X</span>
        <span class="logo-version">v1.0</span>
      </div>
    </div>
    <a href="#" id="settings-btn" class="icon-btn" aria-label="Open Settings" title="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="1.8"/>
      </svg>
    </a>
  </header>

  <!-- Main power toggle -->
  <section class="power-section" aria-labelledby="power-label">
    <div class="power-ring" id="power-ring" aria-hidden="true">
      <div class="power-glow"></div>
      <button
        id="power-btn"
        class="power-btn"
        aria-pressed="false"
        aria-label="Toggle Gesture X on or off"
        title="Toggle Gesture X"
      >
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2v4M12 2v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M4.93 4.93a9 9 0 1 0 14.14 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <p id="power-label" class="power-label">Gesture X is <strong id="power-status-text">Off</strong></p>
  </section>

  <!-- Status cards -->
  <section class="status-grid" aria-label="Recognition status">
    <div class="status-card" id="camera-card">
      <div class="status-card-icon camera-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M23 7 16 12l7 5V7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <rect x="1" y="5" width="15" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/>
        </svg>
      </div>
      <div class="status-card-info">
        <span class="status-card-label">Camera</span>
        <span class="status-card-value" id="camera-status">Inactive</span>
      </div>
      <div class="status-dot" id="camera-dot" aria-label="Camera inactive"></div>
    </div>

    <div class="status-card" id="mic-card">
      <div class="status-card-icon mic-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="9" y="2" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.8"/>
          <path d="M5 10a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M12 19v3M9 22h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="status-card-info">
        <span class="status-card-label">Voice</span>
        <span class="status-card-value" id="mic-status">Inactive</span>
      </div>
      <div class="status-dot" id="mic-dot" aria-label="Microphone inactive"></div>
    </div>
  </section>

  <!-- Individual toggles -->
  <section class="toggle-section" aria-label="Feature toggles">
    <div class="toggle-row">
      <div class="toggle-info">
        <span class="toggle-label">Gesture Control</span>
        <span class="toggle-desc">Hand gestures via camera</span>
      </div>
      <label class="toggle-switch" for="gesture-toggle" aria-label="Toggle gesture control">
        <input type="checkbox" id="gesture-toggle" role="switch" aria-checked="true" checked />
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
      </label>
    </div>

    <div class="toggle-divider" role="separator"></div>

    <div class="toggle-row">
      <div class="toggle-info">
        <span class="toggle-label">Virtual Mouse</span>
        <span class="toggle-desc">Point & click air mouse</span>
      </div>
      <label class="toggle-switch" for="mouse-toggle" aria-label="Toggle virtual mouse">
        <input type="checkbox" id="mouse-toggle" role="switch" aria-checked="false" />
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
      </label>
    </div>

    <div class="toggle-divider" role="separator"></div>

    <div class="toggle-row">
      <div class="toggle-info">
        <span class="toggle-label">Voice Control</span>
        <span class="toggle-desc">Always-on speech commands</span>
      </div>
      <label class="toggle-switch" for="voice-toggle" aria-label="Toggle voice control">
        <input type="checkbox" id="voice-toggle" role="switch" aria-checked="true" checked />
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
      </label>
    </div>
  </section>

  <!-- Last activity -->
  <section class="last-activity" aria-label="Last recognized input">
    <div class="activity-header">
      <span class="activity-title">Last Activity</span>
      <span class="activity-time" id="activity-time">—</span>
    </div>
    <div class="activity-content" id="activity-content">
      <span class="activity-empty">Nothing recognized yet</span>
    </div>
  </section>

  <!-- Permission error banner (shown only when camera/mic is denied) -->
  <div class="perm-banner" id="perm-banner" role="alert" aria-live="polite" hidden>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/>
      <path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span id="perm-banner-text">Camera access denied.</span>
    <a
      id="perm-banner-link"
      href="#"
      class="perm-banner-link"
      aria-label="Open Chrome camera settings"
    >Fix</a>
  </div>

  <!-- Footer -->
  <footer class="footer" role="contentinfo">
    <a
      id="open-settings-full"
      href="#"
      class="footer-link"
      aria-label="Open full settings page"
    >
      Full Settings
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M7 17 17 7M7 7h10v10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <span class="footer-separator" aria-hidden="true">·</span>
    <a
      href="https://github.com/gesture-x"
      target="_blank"
      rel="noopener noreferrer"
      class="footer-link"
      aria-label="View source on GitHub (opens in new tab)"
    >
      GitHub
    </a>
  </footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
